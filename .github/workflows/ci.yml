name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check formatting with black
      run: |
        pip install black
        black --check src/
    
    - name: Run tests with pytest
      run: |
        pip install pytest pytest-cov
        pytest tests/ --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Run eval regression
      run: |
        # The regression gate needs both a committed baseline AND the built
        # vector index. The 43k-chunk index is not committed (shipped as a
        # GitHub Release asset), so this gate runs locally / pre-push, not in
        # stock CI. Skip cleanly when the index is absent.
        # --no-save: the gate must not overwrite the committed results
        # artifact (data/eval_results.json) as a side effect of checking.
        if [ -f data/eval/baseline.json ] && [ -f data/vectordb/chroma.sqlite3 ]; then
          python scripts/eval_retrieval.py --regression --no-save
        else
          echo "Skipping eval regression: needs data/eval/baseline.json + a built index (data/vectordb)."
        fi
